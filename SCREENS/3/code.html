<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>SAHO - Listening</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#a3f69c",
                        "primary-container": "#1a237e",
                        "tertiary-fixed": "#ffdcc2",
                        "on-tertiary-container": "#e17e00",
                        "surface-container-low": "#f3f4f5",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#e1e3e4",
                        "on-surface": "#191c1d",
                        "secondary-fixed-dim": "#88d982",
                        "background": "#f8f9fa",
                        "on-surface-variant": "#454652",
                        "surface-container-high": "#e7e8e9",
                        "on-secondary-fixed-variant": "#005312",
                        "surface-bright": "#f8f9fa",
                        "primary-fixed": "#e0e0ff",
                        "surface-container": "#edeeef",
                        "on-error": "#ffffff",
                        "tertiary-fixed-dim": "#ffb77a",
                        "tertiary-container": "#4b2600",
                        "primary": "#000666",
                        "secondary": "#1b6d24",
                        "surface-tint": "#4c56af",
                        "on-primary-fixed-variant": "#343d96",
                        "on-primary-fixed": "#000767",
                        "on-tertiary-fixed": "#2e1500",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed-variant": "#6d3a00",
                        "error": "#ba1a1a",
                        "outline": "#767683",
                        "on-background": "#191c1d",
                        "surface-container-lowest": "#ffffff",
                        "on-primary-container": "#8690ee",
                        "on-secondary-fixed": "#002204",
                        "inverse-primary": "#bdc2ff",
                        "on-secondary-container": "#217128",
                        "surface-variant": "#e1e3e4",
                        "outline-variant": "#c6c5d4",
                        "tertiary": "#2d1400",
                        "error-container": "#ffdad6",
                        "surface-dim": "#d9dadb",
                        "inverse-surface": "#2e3132",
                        "primary-fixed-dim": "#bdc2ff",
                        "inverse-on-surface": "#f0f1f2",
                        "surface": "#f8f9fa",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "secondary-container": "#a0f399"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "sm": "12px",
                        "md": "24px",
                        "touch-target-min": "48px",
                        "lg": "40px",
                        "xs": "4px",
                        "container-padding": "20px",
                        "xl": "64px"
                    },
                    "fontFamily": {
                        "label-sm": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Inter"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"],
                        "headline-xl": ["Plus Jakarta Sans"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "fontWeight": "600" }],
                        "headline-xl": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            line-height: 1;
            text-transform: none;
            letter-spacing: normal;
            word-wrap: normal;
            white-space: nowrap;
            direction: ltr;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.2; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        .mic-ring {
            animation: pulse-ring 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        .waveform-bar {
            width: 4px;
            border-radius: 2px;
            background: #1a237e; /* primary-container */
            animation: waveform 1.2s ease-in-out infinite;
        }

        @keyframes waveform {
            0%, 100% { height: 10px; opacity: 0.3; }
            50% { height: 40px; opacity: 1; }
        }

        .glass-bg {
            backdrop-filter: blur(40px) saturate(180%);
            -webkit-backdrop-filter: blur(40px) saturate(180%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen overflow-hidden">
<!-- Mock Background (Deep Blurred Home Screen) -->
<div class="fixed inset-0 z-0">
<div class="absolute inset-0 bg-surface-container opacity-50"></div>
<div class="p-md grid grid-cols-2 gap-md opacity-20">
<div class="h-40 rounded-xl bg-primary-container/20"></div>
<div class="h-40 rounded-xl bg-secondary-container/20"></div>
<div class="h-64 col-span-2 rounded-xl bg-tertiary-fixed/20"></div>
</div>
<div class="absolute inset-0 glass-bg bg-background/60"></div>
</div>
<!-- Active Listening Layer -->
<main class="relative z-10 flex flex-col items-center justify-between min-h-screen py-xl px-container-padding">
<!-- Header / Logo Anchor (Optional, but keeping for brand identity) -->
<div class="w-full flex justify-center opacity-40">
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">SAHO</span>
</div>
<!-- Central Interaction Cluster -->
<div class="flex flex-col items-center gap-xl w-full max-w-[600px]">
<!-- Mic Animation Container -->
<div class="relative flex items-center justify-center">
<!-- Pulsing Rings -->
<div class="absolute w-48 h-48 rounded-full bg-primary-container/10 mic-ring" style="animation-delay: 0s;"></div>
<div class="absolute w-48 h-48 rounded-full bg-primary-container/10 mic-ring" style="animation-delay: 1s;"></div>
<div class="absolute w-48 h-48 rounded-full bg-primary-container/10 mic-ring" style="animation-delay: 2s;"></div>
<!-- Main Microphone Icon -->
<div class="relative z-20 w-32 h-32 flex items-center justify-center rounded-full bg-primary shadow-xl scale-100 active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined text-white text-[48px]" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
</div>
<!-- Listening Text -->
<div class="text-center space-y-md">
<h1 class="font-headline-xl text-headline-xl text-primary animate-pulse">Listening...</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[80%] mx-auto">
                    Speak clearly. I am here to help with your recovery today.
                </p>
</div>
<!-- Organic CSS Waveform -->
<div class="flex items-center justify-center gap-1.5 h-16 w-full">
<div class="waveform-bar" style="animation-delay: 0.1s; height: 12px;"></div>
<div class="waveform-bar" style="animation-delay: 0.3s; height: 24px;"></div>
<div class="waveform-bar" style="animation-delay: 0.5s; height: 36px;"></div>
<div class="waveform-bar" style="animation-delay: 0.2s; height: 48px;"></div>
<div class="waveform-bar" style="animation-delay: 0.4s; height: 32px;"></div>
<div class="waveform-bar" style="animation-delay: 0.6s; height: 18px;"></div>
<div class="waveform-bar" style="animation-delay: 0.1s; height: 28px;"></div>
<div class="waveform-bar" style="animation-delay: 0.4s; height: 40px;"></div>
<div class="waveform-bar" style="animation-delay: 0.2s; height: 20px;"></div>
<div class="waveform-bar" style="animation-delay: 0.5s; height: 12px;"></div>
</div>
</div>
<!-- Footer / Cancel Action -->
<div class="w-full flex justify-center pb-md">
<button class="font-label-md text-label-md text-primary opacity-60 hover:opacity-100 transition-opacity flex items-center gap-xs px-md py-sm rounded-full bg-surface-container-high/30 hover:bg-surface-container-high/50">
<span class="material-symbols-outlined text-[18px]">close</span>
                Tap to stop
            </button>
</div>
</main>
<!-- Micro-interaction Script -->
<script>
        // Simulating voice intensity changes
        const bars = document.querySelectorAll('.waveform-bar');
        
        setInterval(() => {
            bars.forEach(bar => {
                // Randomly perturb the duration and height to feel more "organic"
                const randomHeight = Math.floor(Math.random() * 40) + 10;
                bar.style.height = randomHeight + 'px';
            });
        }, 150);

        // Micro-interaction for the "Stop" button
        const stopBtn = document.querySelector('button');
        stopBtn.addEventListener('click', () => {
            document.body.classList.add('opacity-0');
            setTimeout(() => {
                alert('Listening session ended.');
                document.body.classList.remove('opacity-0');
            }, 300);
        });
    </script>
</body></html>
