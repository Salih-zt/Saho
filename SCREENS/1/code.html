<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .fade-in {
            animation: fadeIn 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        .slide-up {
            animation: slideUp 1.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .slow-float {
            animation: float 6s ease-in-out infinite;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* Glassmorphism utility */
        .glass {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

<style>

<body class="bg-background text-on-background overflow-hidden h-screen w-full flex items-center justify-center">
<!-- Ambient Gradient Background -->
<div class="fixed inset-0 z-0 bg-gradient-to-br from-background via-white to-primary-fixed/30"></div>
<!-- Animated Atmospheric Shader Layer -->
<div class="fixed inset-0 z-10 opacity-40 mix-blend-soft-light">

</div>
<!-- Main Content Canvas -->
<main class="relative z-20 flex flex-col items-center justify-center max-w-[600px] w-full px-md text-center">
<!-- Calming Illustration (Sunrise / Hands) -->
<div class="mb-xl slow-float">
<div class="relative w-64 h-64 md:w-80 md:h-80 mx-auto rounded-full overflow-hidden flex items-center justify-center shadow-2xl shadow-primary/5">
<img class="w-full h-full object-cover" data-alt="A hyper-minimalist and premium digital illustration of a soft, hazy sunrise over a calm ocean. The colors transition from a gentle off-white to a very pale, soothing deep blue. Two abstract, organic shapes resembling supportive hands are subtly integrated into the horizon line. The lighting is ethereal and high-key, evoking a sense of profound peace, recovery, and a quiet, steady hand of support. The overall aesthetic is clean, modernist, and emotionally safe." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCKIE3n_Obf_9WHnGDC3cZftzwwN08MuEIlROoLtZy4-5eBXSuryEmKYisslkqVT1CGtF35gG21qzzMoOpSUrlegfQsQkj9Y6wyFiRTEB_yZbcQ3EF053au9W8q6K6kpYFZzCEqhXHAZEVN9e-BAh4psuvlJUlzBh85lhlzL2xL3-B-hwbrxwnHlbP-L5xKP9DIdoZELCApZdpbvRPgvEAS0b6I53jqiYCDNxLPS2d5nRaXXcW8h8F-7h7HU01H4yjc7Ij2CJiH23c"/>

</div>
</div>
<!-- Logo & Brand Identity -->
<div class="slide-up space-y-sm">
<!-- Abstract 'Brother' Symbol Logo Mark -->
<div class="flex justify-center mb-base">
<div class="w-16 h-16 bg-primary rounded-2xl flex items-center justify-center shadow-lg transform rotate-45">
<span class="material-symbols-outlined text-white text-[32px] -rotate-45" style="font-variation-settings: 'FILL' 1;">
                        diversity_1
                    </span>
</div>
</div>
<!-- Brand Name -->
<h1 class="font-headline-xl text-headline-xl text-primary tracking-tight">
                SAHO
            </h1>
<!-- Tagline -->
<p class="font-body-lg text-body-lg text-on-surface-variant font-medium tracking-wide">
                Your brother through recovery.
            </p>
</div>
<!-- Progress/Loading Indicator (Subtle) -->
<div class="mt-xl w-16 h-[4px] bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full slide-progress w-full" style="animation: progress 3s ease-in-out infinite;"></div>
</div>
<p class="mt-md font-label-sm text-label-sm text-outline opacity-60">
            Finding your steady hand...
        </p>
</main>
<!-- Interactive Atmospheric Elements -->
<script>
        // Micro-interaction for mouse movement to shift background subtly
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            const mainContent = document.querySelector('main');
            if (mainContent) {
                const moveX = (x - 0.5) * 15;
                const moveY = (y - 0.5) * 15;
                mainContent.style.transform = `translate(${moveX}px, ${moveY}px)`;
            }
        });

        // Keyframe for the subtle progress bar animation
        const style = document.createElement('style');
        style.innerHTML = `
            @keyframes progress {
                0% { transform: translateX(-100%); }
                50% { transform: translateX(0%); }
                100% { transform: translateX(100%); }
            }
        `;
        document.head.appendChild(style);
    </script>
