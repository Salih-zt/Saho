<script>
        // Micro-interactions for the central button
        const mainButton = document.querySelector('.blue-emerald-gradient');
        
        mainButton.addEventListener('touchstart', () => {
            mainButton.classList.add('scale-90');
        });

        mainButton.addEventListener('touchend', () => {
            mainButton.classList.remove('scale-90');
        });

        // Background subtle parallax effect
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            const auras = document.querySelectorAll('.aura-animation');
            auras.forEach((aura, index) => {
                const speed = (index + 1) * 20;
                aura.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>
